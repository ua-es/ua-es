name: Deploy to GitHub Pages

# Runs only after the "Quality checks" workflow succeeded on main.
on:
  workflow_run:
    workflows: ["Quality checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html css js assets images robots.txt sitemap.xml _site/
          node --input-type=module <<'NODE'
          import { cpSync, readFileSync } from "node:fs";

          const { languages } = JSON.parse(readFileSync("src/languages.json", "utf8"));
          for (const { path } of languages) {
            if (path) cpSync(path, `_site/${path}`, { recursive: true });
          }
          NODE

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
